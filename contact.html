<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Travel Recommendation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay">
        <nav>
            <div class="logo">TravelRecommend</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

        <div class="page-content">
            <h2>CONTACT US</h2>
            <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent successfully!');">
                <label>Name</label>
                <input type="text" placeholder="Enter your name" required>
                
                <label>Email</label>
                <input type="email" placeholder="Enter your email" required>
                
                <label>Message</label>
                <textarea rows="5" placeholder="Enter your message" required></textarea>
                
                <button type="submit">Submit</button>
            </form>
        </div>
    </div>
</body>
</html>
